baseURL = "https://clairekiu.github.io/"
locale = "ko-KR"
title = "clairekiu's blog"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

[pagination]
  pagerSize = 8

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

