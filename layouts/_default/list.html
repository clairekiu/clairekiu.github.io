{{ define "main" }}
<section class="page wrap">
  <p class="eyebrow">ARCHIVE</p>
  <h1>{{ .Title }}</h1>
  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <article class="post-card">
      <p class="date">{{ .Date.Format "2006. 01. 02" }}</p>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
