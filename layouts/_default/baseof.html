<!doctype html>
<html lang="{{ site.Language.Locale | default "ko-KR" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    {{ with resources.Get "css/main.css" }}{{ $style := . | minify | fingerprint }}<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">{{ end }}
  </head>
  <body>
    <header class="site-header">
      <nav class="nav wrap" aria-label="주요 메뉴">
        <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
        <div class="nav-links">
          <a href="{{ site.Home.RelPermalink }}">홈</a>
          <a href="/posts/">글</a>
        </div>
      </nav>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer wrap">© {{ now.Year }} {{ site.Title }}</footer>
  </body>
</html>
