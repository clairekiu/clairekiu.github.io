<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>im static</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>quick quiz</h1>

    <section class="birthday-quiz">
        <h2>내 생일 맞추기 🎂</h2>
        <form id="birthday-quiz-form">
            <div class="quiz-inputs">
                <label>
                    <span>월</span>
                    <input type="text" id="birthday-month" inputmode="numeric" placeholder="1–12" maxlength="2" size="3" autocomplete="off">
                </label>
                <span class="quiz-sep">/</span>
                <label>
                    <span>일</span>
                    <input type="text" id="birthday-day" inputmode="numeric" placeholder="1–31" maxlength="2" size="3" autocomplete="off">
                </label>
            </div>
            <button type="submit" id="quiz-submit">확인</button>
        </form>
        <p id="quiz-result" class="quiz-result" hidden></p>
    </section>

    <footer>
        <br>&copy; 2026 clairekiu. All rights reserved.
    </footer>
    <script src="script.js"></script>
</body>
</html>
